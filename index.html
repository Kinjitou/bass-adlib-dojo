<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ベース初心者が楽器を持ったまま、指板図・ステップ式レッスン・コード追従伴奏でアドリブを覚える練習アプリ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ベース・アドリブ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 指板を主役に据えた練習スタンド型。指板 → 伴奏ストリップ → 設定 → 学習パネルの縦一列 */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface2:#f3f6f8; --ink:#17202a; --muted:#5a6672; --line:#d2d9e0;
  --accent:#1d5d8a; --accent-ink:#ffffff; --accent-soft:#d9e8f3;
  --wood:#3a2920; --wood-edge:#271a14; --fret:#b8bec5; --string:#dcd2c2; --inlay:#efe7d6;
  --r-root:#d6402a; --r-3:#e3a913; --r-5:#1f907d; --r-7:#7a5ac6; --r-blue:#2f6fd6; --r-other:#eef1f4;
  --on-dot:#ffffff; --on-light:#1b2229;
  --display:'Dela Gothic One','Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --surface:#1a2027; --surface2:#212830; --ink:#e6eaee; --muted:#96a1ac; --line:#2c343d;
  --accent:#5ba5d8; --accent-ink:#0b1822; --accent-soft:#1d3446; --r-other:#d5dce3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#1a2027; --surface2:#212830; --ink:#e6eaee; --muted:#96a1ac; --line:#2c343d;
  --accent:#5ba5d8; --accent-ink:#0b1822; --accent-soft:#1d3446; --r-other:#d5dce3; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.2;margin:0;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.board-card{padding:10px 10px 6px}
.board-scroll{overflow-x:auto}
#board{display:block;width:100%;min-width:760px;height:auto;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 6px 2px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block}

/* SVG */
.wood{fill:var(--wood)} .wood-edge{fill:var(--wood-edge)}
.fretl{stroke:var(--fret);stroke-width:3}
.nut{fill:var(--inlay)}
.inlay{fill:var(--inlay);opacity:.5}
#board.vert .inlay{opacity:.22}
.str{stroke:var(--string)}
.slab{fill:var(--muted);font:700 13px var(--mono)}
.fnum{fill:var(--muted);font:500 11px var(--mono);text-anchor:middle}
.fnum.mk{fill:var(--ink);font-weight:700}
.boxr{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.nd{cursor:pointer}
.nd circle{transition:transform .12s ease;transform-box:fill-box;transform-origin:center}
.nd.hit circle.dot{transform:scale(1.3)}
.c-root{fill:var(--r-root)} .c-third{fill:var(--r-3)} .c-fifth{fill:var(--r-5)} .c-seventh{fill:var(--r-7)} .c-blue{fill:var(--r-blue)} .c-other{fill:var(--r-other)}
.weak{fill:var(--r-other);opacity:.85}
.ring{fill:none;stroke:var(--r-root);stroke-width:2.5;stroke-dasharray:4 3}
.lbl-d{fill:var(--on-dot);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl-l{fill:var(--on-light);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}

/* strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px 14px}
.play{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;min-width:132px;font-size:1rem}
.play.on{background:var(--r-root);color:var(--on-dot)}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.tag{font-size:.7rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.chord{font-family:var(--mono);font-weight:700;font-size:2rem;line-height:1;min-width:4.2ch}
.nextc{font-family:var(--mono);font-weight:700;font-size:1.1rem;color:var(--muted)}
.beats{display:flex;gap:5px}
.beats i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--accent)}
.beats i.on.one{background:var(--r-root)}
.chips{display:flex;gap:4px;flex:1 1 260px;min-width:0}
.chip{flex-grow:var(--g);flex-basis:0;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 4px;font:700 .78rem var(--mono);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.chip.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tempo{display:grid;gap:2px;min-width:150px}
.tempo label{font-size:.8rem;color:var(--muted)}
.tempo b{font-family:var(--mono);color:var(--ink);font-size:1rem}
input[type=range]{accent-color:var(--accent);width:100%}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px 16px;padding:12px 14px;align-items:end}
.field{display:grid;gap:3px;min-width:0}
.field>label,.field>.fl{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select:disabled{opacity:.5}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface2);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.vol{display:flex;gap:10px}
.vol .field{width:110px}
.hint{font-size:.78rem;color:var(--muted);flex-basis:100%;margin:0}

/* panel */
.panel{padding:16px}
.lesson{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:20px}
@media (max-width:720px){.lesson{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:s}
.steps button{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.steps button:hover{background:var(--surface2)}
.steps button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.steps .n{font:700 .8rem var(--mono);color:var(--accent);min-width:2ch}
.lesson article{min-width:0;max-width:68ch}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.35;margin:0 0 6px;text-wrap:balance}
h3{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.lead{margin:0}
.try{margin:0;padding-left:1.3em;display:grid;gap:6px}
.tip{margin-top:14px;padding:10px 14px;background:var(--surface2);border-radius:10px;border-left:4px solid var(--r-3)}
.note{font-size:.8rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sc{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:4px;min-width:0}
.sc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sc strong{font-size:1rem}
.degs{display:flex;flex-wrap:wrap;gap:4px}
.degs span{font:700 .72rem var(--mono);padding:2px 6px;border-radius:6px;color:var(--on-dot)}
.degs span.l{color:var(--on-light)}
.sc p{margin:0;font-size:.86rem;color:var(--muted)}
dl.gloss{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:6px 16px;margin:0}
dl.gloss dt{font-weight:700}
dl.gloss dd{margin:0;color:var(--muted)}
@media (max-width:520px){dl.gloss{grid-template-columns:1fr} dl.gloss dd{margin-bottom:6px}}
.chartline{font:700 .95rem var(--mono);margin:6px 0 0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.nd circle{transition:none}}

/* settings drawer */
details.ctl>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;min-height:48px}
details.ctl>summary::-webkit-details-marker{display:none}
details.ctl>summary::after{content:'＋';margin-left:auto;color:var(--accent);font-weight:700}
details.ctl[open]>summary::after{content:'－'}
details.ctl[open]>summary{border-bottom:1px solid var(--line)}
.sumstate{font:500 .8rem var(--mono);color:var(--muted);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,svg,.chip,select{touch-action:manipulation}
#board.vert{min-width:0;max-width:440px;margin:0 auto}

/* phone mini transport */
.mini{display:none}
@media (max-width:700px){
  body{font-size:15.5px}
  .wrap{padding-block:12px calc(108px + env(safe-area-inset-bottom,0px));gap:12px}
  header{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
  .brand h1{font-size:1.35rem}
  .brand p{font-size:.8rem}
  .tabs{width:100%;justify-self:stretch}
  .tabs button{flex:1;padding:10px 6px;min-height:44px}
  .board-card{padding:6px 4px 4px}
  .legend{gap:4px 12px;font-size:.75rem}
  .strip{padding:10px 12px;gap:10px}
  .strip .play,.strip .now{display:none}
  .chips{flex-basis:100%}
  .chip{padding:11px 4px;font-size:.8rem}
  .tempo{flex:1 1 100%}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .controls select{width:100%;padding:10px}
  .controls .chk,.controls .hint,.controls .vol{grid-column:1/-1}
  .vol .field{flex:1;width:auto}
  .seg button{flex:1;padding:10px 8px;min-height:44px}
  .chk{min-height:44px}
  .panel{padding:14px}
  .steps{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .steps li{scroll-snap-align:start}
  .steps button{min-height:44px;border-color:var(--line)}
  .btn{min-height:46px;flex:1 1 auto}
  .grid{grid-template-columns:1fr}
  .mini{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -6px 18px rgba(0,0,0,.08)}
  .mini .play{min-width:0;width:64px;height:56px;padding:0;font-size:1.3rem;border-radius:14px}
  .mini .chord{font-size:1.8rem}
  .mini .mnow{min-width:0;flex:1}
  .mini .mnext{text-align:right}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>ベース・アドリブ道場</h1>
      <p>楽器を持ったまま、見て・鳴らして・弾いて覚える</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="モード">
      <button role="tab" id="tab-lesson" data-tab="lesson">レッスン</button>
      <button role="tab" id="tab-scale" data-tab="scale">スケール</button>
      <button role="tab" id="tab-prog" data-tab="prog">進行モード</button>
    </nav>
  </header>

  <section class="card board-card" aria-label="指板">
    <div class="board-scroll"><svg id="board" viewBox="0 0 1000 230" role="img" aria-label="ベース指板（上が1弦G、下が4弦E）"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card strip" aria-label="伴奏">
    <button class="play" id="play" type="button">▶ 伴奏スタート</button>
    <div class="now">
      <div><div class="tag">いま</div><div class="chord" id="nowChord">Am7</div></div>
      <div><div class="beats" id="beats"><i></i><i></i><i></i><i></i></div><div class="tag" id="barNo" style="margin-top:4px">&nbsp;</div></div>
      <div><div class="tag">次</div><div class="nextc" id="nextChord">—</div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tempo"><label for="tempo">テンポ <b id="bpm">90</b> BPM</label><input type="range" id="tempo" min="50" max="160" step="1"></div>
  </section>

  <details class="card ctl" id="ctlBox" open>
  <summary>表示設定・音量 <span class="sumstate" id="sumState"></span></summary>
  <section class="controls" aria-label="表示設定">
    <div class="field"><label for="key">キー</label><select id="key"></select></div>
    <div class="field"><label for="scale">スケール</label><select id="scale"></select></div>
    <div class="field"><label for="pos">ポジション（4フレット幅）</label><select id="pos"></select></div>
    <div class="field"><label for="prog">伴奏の進行</label><select id="prog"></select></div>
    <div class="field"><span class="fl">丸の中の表示</span>
      <div class="seg" role="group" aria-label="丸の中の表示"><button type="button" id="lbl-note" data-l="note">音名</button><button type="button" id="lbl-deg" data-l="deg">度数</button></div></div>
    <label class="chk" for="follow"><input type="checkbox" id="follow"> コードに追従</label>
    <div class="vol">
      <div class="field"><label for="vd">ドラム音量</label><input type="range" id="vd" min="0" max="1" step="0.05"></div>
      <div class="field"><label for="vc">コード音量</label><input type="range" id="vc" min="0" max="1" step="0.05"></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>
  </details>

  <section class="card panel" id="panel" aria-live="polite"></section>
</div>

<div class="mini" id="mini" aria-label="伴奏コントロール">
  <button class="play" id="mplay" type="button" aria-label="伴奏スタート">▶</button>
  <div class="mnow"><div class="tag">いま</div><div class="chord" id="mChord">Am7</div></div>
  <div class="beats" id="mbeats"><i></i><i></i><i></i><i></i></div>
  <div class="mnext"><div class="tag">次</div><div class="nextc" id="mNext">—</div></div>
</div>

<script>
const NOTE=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const DEG=['R','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'];
const STR=[{n:'G',m:43,w:1.8},{n:'D',m:38,w:2.4},{n:'A',m:33,w:3.0},{n:'E',m:28,w:3.6}];
const FRETS=15;

const SCALES={
  root:{name:'ルートだけ',iv:[0],sound:'キーの中心。どんな時も帰ってこられる音。',use:'最初の一歩。位置を覚える。'},
  r5:{name:'ルート＋5度',iv:[0,7],sound:'力強く、どのコードにも溶ける。',use:'ロック、カントリー、ルート弾きからの脱却に。'},
  minpent:{name:'マイナー・ペンタトニック',iv:[0,3,5,7,10],sound:'渋くてブルージー。外れる音がほぼ無い。',use:'ロック、ブルース、ファンク。アドリブの基本形。'},
  majpent:{name:'メジャー・ペンタトニック',iv:[0,2,4,7,9],sound:'明るく、のびやか。',use:'ポップス、カントリー、明るい進行。'},
  blues:{name:'ブルース・スケール',iv:[0,3,5,6,7,10],sound:'マイナー・ペンタ＋♭5。ねじれた色気。',use:'ブルース、ファンク、ロック。♭5は通過音で。'},
  major:{name:'メジャー（アイオニアン）',iv:[0,2,4,5,7,9,11],sound:'ドレミファソラシ。いちばん標準的な明るさ。',use:'ダイアトニックな進行全般。'},
  minor:{name:'ナチュラル・マイナー',iv:[0,2,3,5,7,8,10],sound:'暗く、切ない。',use:'マイナーキーの曲、バラード。'},
  dorian:{name:'ドリアン',iv:[0,2,3,5,7,9,10],sound:'マイナーなのに少し明るい（6度が鍵）。',use:'ファンク、フュージョン、m7のワンコード。'},
  mixo:{name:'ミクソリディアン',iv:[0,2,4,5,7,9,10],sound:'メジャー＋♭7。ゆるく土臭い明るさ。',use:'7thコード、ファンク、ロック。'},
  hmp5:{name:'ハーモニック・マイナーP5↓',iv:[0,1,4,5,7,8,10],sound:'エキゾチックで緊張感が強い。',use:'マイナーキーに戻る直前の7thコード（例：E7→Am）。'},
  arpM7:{name:'maj7 アルペジオ',iv:[0,4,7,11],sound:'おしゃれで浮遊感のある和音の骨組み。',use:'シティポップ、ジャズのmaj7上。'},
  arp7:{name:'7th アルペジオ',iv:[0,4,7,10],sound:'ブルースやファンクの骨組み。',use:'7thコードでの着地点探し。'},
  arpm7:{name:'m7 アルペジオ',iv:[0,3,7,10],sound:'柔らかいマイナーの骨組み。',use:'m7コードでの着地点探し。'}
};
const SC_ORDER=['root','r5','minpent','majpent','blues','major','minor','dorian','mixo','hmp5','arpM7','arp7','arpm7'];

const Q={maj:{s:'',iv:[0,4,7]},m:{s:'m',iv:[0,3,7]},'7':{s:'7',iv:[0,4,7,10]},maj7:{s:'maj7',iv:[0,4,7,11]},m7:{s:'m7',iv:[0,3,7,10]}};

const PROGS={
  vamp_m7:{name:'ワンコード（m7）',sc:'minpent',chords:[{d:0,q:'m7',b:8}],
    desc:'コードが変わらないので、スケールの箱を覚えるのに最適。',aim:'ルートと♭3（黄）を着地点にする。'},
  vamp_7:{name:'ファンク・ワンコード（7th）',sc:'blues',chords:[{d:0,q:'7',b:8}],
    desc:'1つの7thコードを延々と回す。リズムの練習向き。',aim:'音数を絞り、休符と16分のノリで勝負。'},
  blues12:{name:'12小節ブルース',sc:'blues',chords:[{d:0,q:'7',b:4},{d:5,q:'7',b:4},{d:0,q:'7',b:8},{d:5,q:'7',b:8},{d:0,q:'7',b:8},{d:7,q:'7',b:4},{d:5,q:'7',b:4},{d:0,q:'7',b:4},{d:7,q:'7',b:4}],
    desc:'I7・IV7・V7の3コードで12小節。セッションの共通言語。',aim:'コードが変わる1拍目にそのコードのルートか3度を置く。'},
  pop50:{name:'50年代進行（I–vi–IV–V）',sc:'major',chords:[{d:0,q:'maj',b:4},{d:9,q:'m',b:4},{d:5,q:'maj',b:4},{d:7,q:'maj',b:4}],
    desc:'オールディーズから現代ポップまで定番の明るい進行。',aim:'3度（黄）の移り変わりを追う。'},

/* ---------- state ---------- */
const DEF={tab:'lesson',lesson:0,key:9,scale:'root',pos:null,prog:'vamp_m7',follow:false,label:'note',tempo:80,vd:0.7,vc:0.45,preview:0};
let S=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('bassdojo')||'null'); if(s) S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem('bassdojo',JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const prog=()=>PROGS[S.prog];
const chordRoot=c=>(S.key+c.d)%12;
const chordName=c=>NOTE[chordRoot(c)]+Q[c.q].s;

/* ---------- board ---------- */
const NUT=72, END=982, K=(END-NUT)/(1-Math.pow(2,-FRETS/12));
const fx=n=>NUT+K*(1-Math.pow(2,-n/12));
const nx=f=>f===0?NUT-30:(fx(f-1)+fx(f))/2;
const sy=i=>42+i*44;
function roleOf(i,blue){if(i===0)return'root';if(i===3||i===4)return'third';if(i===7)return'fifth';if(i===10||i===11)return'seventh';if(i===6&&blue)return'blue';return'other'}
function curIdx(){return play.on&&play.idx>=0?play.idx:Math.min(S.preview,prog().chords.length-1)}

function noteSets(){
  let labelRoot,scaleSet,chordSet=null,nextRoot=null,blue=false;
  if(S.follow){
    const p=prog(),ci=curIdx(),c=p.chords[ci],cr=chordRoot(c);
    chordSet=new Set(Q[c.q].iv.map(i=>(cr+i)%12));
    const sr=c.sc?cr:(S.key+(p.from||0))%12, siv=SCALES[c.sc||p.sc].iv;
    scaleSet=new Set(siv.map(i=>(sr+i)%12));
    labelRoot=cr;
    if(p.chords.length>1){const nc=p.chords[(ci+1)%p.chords.length]; nextRoot=chordRoot(nc);}
  }else{
    labelRoot=S.key; blue=S.scale==='blues';
    scaleSet=new Set(SCALES[S.scale].iv.map(i=>(S.key+i)%12));
  }
  return {labelRoot,scaleSet,chordSet,nextRoot,blue};
}
function dotsSvg(P,f0,f1,lo,hi,ns){
  const {labelRoot,scaleSet,chordSet,nextRoot,blue}=ns;let dots='';
  STR.forEach((s,si)=>{for(let f=f0;f<=f1;f++){
    const m=s.m+f,pc=m%12,inS=scaleSet.has(pc),inC=chordSet?chordSet.has(pc):inS,isN=nextRoot===pc&&nextRoot!==labelRoot;
    if(!inS&&!inC&&!isN)continue;
    const iv=(pc-labelRoot+12)%12,[x,y]=P(si,f);
    const out=S.pos!==null&&(f<lo||f>hi);
    let g=`<g class="nd" data-m="${m}" opacity="${out?0.28:1}"><title>${si+1}弦${f}フレット ${NOTE[pc]}（${DEG[iv]}）</title>`;
    g+=`<circle cx="${x}" cy="${y}" r="21" fill="transparent"/>`;
    if(isN)g+=`<circle class="ring" cx="${x}" cy="${y}" r="18"/>`;
    if(inC){const r=roleOf(iv,blue),light=r==='third'||r==='other';
      g+=`<circle class="dot c-${r}" cx="${x}" cy="${y}" r="14"/><text class="${light?'lbl-l':'lbl-d'}" x="${x}" y="${y}">${S.label==='deg'?DEG[iv]:NOTE[pc]}</text>`;}
    else if(inS){g+=`<circle class="dot weak" cx="${x}" cy="${y}" r="6.5"/>`;}
    dots+=g+'</g>';}});
  return dots;
}
const mqPhone=window.matchMedia('(max-width: 700px)');
const coarse=window.matchMedia('(pointer: coarse)').matches;
function renderBoard(){
  const ns=noteSets(),svg=$('board');
  let lo=-1,hi=99; if(S.pos!==null){lo=S.pos;hi=S.pos+3;}
  if(mqPhone.matches){renderVertical(ns,lo,hi);}
  else{
    svg.classList.remove('vert');svg.setAttribute('viewBox','0 0 1000 230');
    svg.setAttribute('aria-label','ベース指板（上が1弦G、下が4弦E、左がナット）');
    svg.innerHTML=horizontalBase(lo,hi)+dotsSvg((si,f)=>[nx(f),sy(si)],0,FRETS,lo,hi,ns);
  }
  renderLegend(ns.blue);
}
function horizontalBase(lo,hi){
  let h='';
  h+=`<rect class="wood-edge" x="${NUT}" y="16" width="${END-NUT+12}" height="184" rx="4"/>`;
  h+=`<rect class="wood" x="${NUT}" y="20" width="${END-NUT+8}" height="176"/>`;
  [3,5,7,9,15].forEach(f=>h+=`<circle class="inlay" cx="${nx(f)}" cy="108" r="7"/>`);
  h+=`<circle class="inlay" cx="${nx(12)}" cy="64" r="7"/><circle class="inlay" cx="${nx(12)}" cy="152" r="7"/>`;
  if(S.pos!==null){const x1=S.pos<=0?NUT-52:fx(S.pos-1)+2,x2=fx(Math.min(hi,FRETS))-2;
    h+=`<rect class="boxr" x="${x1}" y="22" width="${x2-x1}" height="172" rx="8"/>`;}
  for(let n=1;n<=FRETS;n++){h+=`<line class="fretl" x1="${fx(n)}" y1="20" x2="${fx(n)}" y2="196"/>`;
    h+=`<text class="fnum${[3,5,7,9,12,15].includes(n)?' mk':''}" x="${nx(n)}" y="218">${n}</text>`;}
  h+=`<text class="fnum" x="${nx(0)}" y="218">開放</text>`;
  h+=`<rect class="nut" x="${NUT-4}" y="18" width="8" height="180" rx="2"/>`;
  STR.forEach((s,i)=>{h+=`<line class="str" x1="${NUT-46}" y1="${sy(i)}" x2="${END+8}" y2="${sy(i)}" stroke-width="${s.w}"/>`;
    h+=`<text class="slab" x="4" y="${sy(i)+5}">${i+1}${s.n}</text>`;});
  return h;
}
/* 縦向き：スマホ縦持ち用。左が4弦E、右が1弦G、上がナット。ポジション指定時はその周辺だけを拡大表示 */
function renderVertical(ns,lo,hi){
  const svg=$('board'),W=360,TOP=34,CX=178;
  let f0=0,f1=12;
  if(S.pos!==null){if(S.pos<=1){f0=0;f1=S.pos+5;}else{f0=S.pos-1;f1=Math.min(FRETS,S.pos+4);}}
  const RH=S.pos!==null?66:54;
  const vx=si=>70+(3-si)*72;
  const openY=TOP+24,nutY=TOP+46;
  const lineY=n=>f0===0?nutY+n*RH:TOP+10+(n-(f0-1))*RH;
  const noteY=f=>f===0?openY:lineY(f)-RH/2;
  const H=lineY(f1)+14;
  let h='';
  const woodTop=f0===0?nutY:TOP;
  h+=`<rect class="wood-edge" x="38" y="${woodTop}" width="284" height="${lineY(f1)+6-woodTop}" rx="4"/>`;
  h+=`<rect class="wood" x="42" y="${woodTop}" width="276" height="${lineY(f1)+6-woodTop}"/>`;
  for(let f=Math.max(1,f0);f<=f1;f++){
    if([3,5,7,9,15].includes(f))h+=`<circle class="inlay" cx="${CX}" cy="${noteY(f)}" r="7"/>`;
    if(f===12)h+=`<circle class="inlay" cx="106" cy="${noteY(f)}" r="7"/><circle class="inlay" cx="250" cy="${noteY(f)}" r="7"/>`;}
  if(S.pos!==null){const y1=lo===0?TOP:lineY(lo-1)+2,y2=lineY(Math.min(hi,f1))-2;
    h+=`<rect class="boxr" x="44" y="${y1}" width="272" height="${y2-y1}" rx="8"/>`;}
  for(let n=Math.max(1,f0-1);n<=f1;n++){if(n<f0-1)continue;
    h+=`<line class="fretl" x1="42" y1="${lineY(n)}" x2="318" y2="${lineY(n)}"/>`;}
  for(let n=Math.max(1,f0);n<=f1;n++)h+=`<text class="fnum${[3,5,7,9,12,15].includes(n)?' mk':''}" x="18" y="${noteY(n)+4}">${n}</text>`;
  if(f0===0){h+=`<text class="fnum" x="20" y="${openY+4}">開放</text><rect class="nut" x="40" y="${nutY-4}" width="280" height="8" rx="2"/>`;}
  else h+=`<text class="fnum" x="2" y="12" text-anchor="start">↑ナット側</text>`;
  STR.forEach((s,si)=>{h+=`<line class="str" x1="${vx(si)}" y1="${f0===0?openY-18:TOP}" x2="${vx(si)}" y2="${H-4}" stroke-width="${s.w}"/>`;
    h+=`<text class="slab" x="${vx(si)}" y="${f0===0?16:22}" text-anchor="middle">${si+1}${s.n}</text>`;});
  svg.classList.add('vert');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label','ベース指板（縦向き：左が4弦E、右が1弦G、上がナット）');
  svg.innerHTML=h+dotsSvg((si,f)=>[vx(si),noteY(f)],f0,f1,lo,hi,ns);
}
mqPhone.addEventListener?mqPhone.addEventListener('change',()=>{renderBoard();renderPanel()}):mqPhone.addListener(()=>{renderBoard();renderPanel()});
function renderLegend(blue){
  const it=[['var(--r-root)','R（ルート）'],['var(--r-3)','3度'],['var(--r-5)','5度'],['var(--r-7)','7度']];
  if(!S.follow&&blue)it.push(['var(--r-blue)','♭5（ブルーノート）']);
  if(S.follow){it.push(['var(--r-other)','スケール音（小）']);}
  else it.push(['var(--r-other)','その他のスケール音']);
  let h=it.map(([c,t])=>`<span><i style="background:${c};border:1px solid var(--line)"></i>${t}</span>`).join('');
  if(S.follow)h+=`<span><i style="border:2px dashed var(--r-root)"></i>次のコードのルート</span>`;
  h+=`<span>丸を${coarse?'タップ':'クリック'}すると音が鳴る</span>`;
  $('legend').innerHTML=h;
}
$('board').addEventListener('pointerdown',e=>{const g=e.target.closest('.nd');if(!g)return;

/* ---------- strip ---------- */
function renderStrip(){
  const p=prog(),ci=curIdx(),counting=play.on&&play.count>0;
  const now=chordName(p.chords[ci]),nxt=p.chords.length>1?chordName(p.chords[(ci+1)%p.chords.length]):'—';
  if(!counting){$('nowChord').textContent=now;$('mChord').textContent=now;}
  $('nextChord').textContent=nxt;$('mNext').textContent=nxt;
  $('chips').innerHTML=p.chords.map((c,i)=>`<button type="button" class="chip${i===ci?' cur':''}" style="--g:${c.b}" data-i="${i}" title="${c.b}拍">${chordName(c)}</button>`).join('');
  $('play').textContent=play.on?'■ 停止':'▶ 伴奏スタート';
  $('play').classList.toggle('on',play.on);
  $('mplay').textContent=play.on?'■':'▶';$('mplay').setAttribute('aria-label',play.on?'伴奏を止める':'伴奏スタート');
  $('mplay').classList.toggle('on',play.on);
  $('bpm').textContent=S.tempo;
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||play.on)return;S.preview=+b.dataset.i;save();renderStrip();renderBoard();});
function setBeats(beat){['beats','mbeats'].forEach(id=>[...$(id).children].forEach((d,i)=>{d.className=(i<=beat&&beat>=0)?('on'+(i===0?' one':'')):''}));}

/* ---------- controls ---------- */
function fillSelects(){
  $('key').innerHTML=NOTE.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  $('scale').innerHTML=SC_ORDER.map(k=>`<option value="${k}">${SCALES[k].name}</option>`).join('');
  let po='<option value="all">全体</option><option value="0">開放〜3フレット</option>';
  for(let p=1;p<=12;p++)po+=`<option value="${p}">${p}〜${p+3}フレット</option>`;
  $('pos').innerHTML=po;
  $('prog').innerHTML=Object.entries(PROGS).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');
}
function syncControls(){
  $('key').value=S.key;$('scale').value=S.scale;$('pos').value=S.pos===null?'all':S.pos;$('prog').value=S.prog;
  $('follow').checked=S.follow;$('tempo').value=S.tempo;$('vd').value=S.vd;$('vc').value=S.vc;
  $('lbl-note').setAttribute('aria-pressed',S.label==='note');$('lbl-deg').setAttribute('aria-pressed',S.label==='deg');
  $('scale').disabled=S.follow;
  $('hint').textContent=S.follow?'コード追従中：スケールはコードごとに自動で切り替わる。度数は「いまのコードのルート」から数える。':'度数は選んだキーのルートから数える。';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const posTxt=S.pos===null?'全体':S.pos===0?'開放〜3F':`${S.pos}〜${S.pos+3}F`;
  $('sumState').textContent=`キー${NOTE[S.key]} ・ ${S.follow?'コード追従':SCALES[S.scale].name} ・ ${posTxt}`;
}
function all(){syncControls();renderBoard();renderStrip();renderPanel();save();}
$('key').onchange=e=>{S.key=+e.target.value;all()};
$('scale').onchange=e=>{S.scale=e.target.value;all()};
$('pos').onchange=e=>{S.pos=e.target.value==='all'?null:+e.target.value;all()};
$('prog').onchange=e=>{const was=play.on;stop();S.prog=e.target.value;S.preview=0;all();if(was)start();};
$('follow').onchange=e=>{S.follow=e.target.checked;all()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.label=b.dataset.l;all()});
$('tempo').oninput=e=>{S.tempo=+e.target.value;$('bpm').textContent=S.tempo;save()};
$('vd').oninput=e=>{S.vd=+e.target.value;if(drumBus)drumBus.gain.value=S.vd;save()};
$('vc').oninput=e=>{S.vc=+e.target.value;if(padBus)padBus.gain.value=S.vc*0.5;save()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;
  if(S.tab==='prog')S.follow=true; if(S.tab==='scale')S.follow=false; if(S.tab==='lesson')applyLesson(S.lesson,false); all();});

/* ---------- panels ---------- */
function tx(s){const v=mqPhone.matches;return s.replace('{BOARD}',v?'指板図は縦向き。左が4弦（E）、右が1弦（G）、上の太い線がナットで、左の数字がフレット番号。':'指板図は上が1弦（G）、下が4弦（E）。左端の太い線がナット、下の数字がフレット番号。').replace('{R}',v?'下':'右').replace('{L}',v?'上':'左').replace('{TAP}',coarse?'タップ':'クリック');}
function applyLesson(i,stopPlay=true){
  const L=LESSONS[i];S.lesson=i;
  if(stopPlay&&play.on&&L.set.prog!==S.prog)stop();
  Object.assign(S,L.set);S.preview=0;
}
function renderPanel(){
  const P=$('panel');
  if(S.tab==='lesson'){
    const L=LESSONS[S.lesson];
    P.innerHTML=`<div class="lesson">
      <ol class="steps">${LESSONS.map((l,i)=>`<li><button type="button" data-l="${i}" aria-current="${i===S.lesson}"><span class="n">${i+1}</span><span>${l.t}</span></button></li>`).join('')}</ol>
      <article>
        <div class="tag">STEP ${S.lesson+1} / ${LESSONS.length}</div>
        <h2>${L.t}</h2>
        <p class="lead">${tx(L.lead)}</p>
        <h3>やってみる</h3>
        <ol class="try">${L.tryit.map(t=>`<li>${tx(t)}</li>`).join('')}</ol>
        <div class="tip"><strong>コツ</strong>　${L.tip}</div>
        <p class="note">フレット位置の説明は${L.note}。キーを変えると図は追従するが、文中の数字はそのまま。</p>
        <div class="actions">
          <button type="button" class="btn" id="lplay">${play.on?'■ 伴奏を止める':'▶ この設定で伴奏スタート'}</button>
          <button type="button" class="btn ghost" id="lreset">設定をこのステップに戻す</button>
          ${S.lesson<LESSONS.length-1?`<button type="button" class="btn ghost" id="lnext">次のステップへ →</button>`:''}
        </div>
      </article></div>`;
    P.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{applyLesson(+b.dataset.l);all()});
    $('lplay').onclick=()=>{play.on?stop():start();renderPanel()};
    $('lreset').onclick=()=>{applyLesson(S.lesson);all()};
    const n=$('lnext'); if(n)n.onclick=()=>{applyLesson(S.lesson+1);all();window.scrollTo({top:0,behavior:'smooth'})};
  }else if(S.tab==='scale'){
    P.innerHTML=`<h2>スケール図鑑</h2><p class="lead" style="margin-bottom:12px">カードを選ぶと指板に表示される。度数の色は指板の丸と同じ。</p>
      <div class="grid">${SC_ORDER.map(k=>{const s=SCALES[k];return `<button type="button" class="sc" data-s="${k}" aria-pressed="${k===S.scale}">
        <strong>${s.name}</strong>
        <span class="degs">${s.iv.map(i=>{const r=roleOf(i,k==='blues');const map={root:'r-root',third:'r-3',fifth:'r-5',seventh:'r-7',blue:'r-blue',other:'r-other'};return `<span class="${r==='third'||r==='other'?'l':''}" style="background:var(--${map[r]})">${DEG[i]}</span>`}).join('')}</span>
        <p>響き：${s.sound}</p><p>使いどころ：${s.use}</p></button>`}).join('')}</div>
      <h3>用語ミニ辞典</h3>
      <dl class="gloss">${GLOSS.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
    P.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{S.scale=b.dataset.s;S.follow=false;all()});
  }else{
    P.innerHTML=`<h2>進行モード</h2><p class="lead" style="margin-bottom:12px">進行を選んで伴奏をスタート。コードが変わるたびに指板の大きい丸（コードトーン）が切り替わる。停止中はコード名のボタンで各コードを確認できる。</p>
      <div class="grid">${Object.entries(PROGS).map(([k,p])=>`<button type="button" class="sc" data-p="${k}" aria-pressed="${k===S.prog}">
        <strong>${p.name}</strong>
        <span class="chartline">${p.chords.map(chordName).join(' → ')}</span>
        <p>${p.desc}</p><p>狙い目：${p.aim}</p></button>`).join('')}</div>`;
    P.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{const was=play.on;stop();S.prog=b.dataset.p;S.preview=0;S.follow=true;all();if(was)start();});
  }
}

/* ---------- audio ---------- */
let ctx,master,drumBus,padBus,noise;
function ensureAudio(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createDynamicsCompressor();master.connect(ctx.destination);
    drumBus=ctx.createGain();drumBus.gain.value=S.vd;drumBus.connect(master);
    padBus=ctx.createGain();padBus.gain.value=S.vc*0.5;padBus.connect(master);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ctx.state==='suspended')ctx.resume();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+0.13);env(g,t,0.003,0.9,0.28);o.connect(g).connect(drumBus);o.start(t);o.stop(t+0.35);}
function nz(t,freq,peak,dec,type='highpass'){const s=ctx.createBufferSource();s.buffer=noise;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();env(g,t,0.002,peak,dec);s.connect(f).connect(g).connect(drumBus);s.start(t);s.stop(t+dec+0.05);}
function snare(t){nz(t,1400,0.45,0.16);const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=190;env(g,t,0.002,0.3,0.08);o.connect(g).connect(drumBus);o.start(t);o.stop(t+0.12);}
function hat(t,p){nz(t,7500,p,0.04);}
function click(t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1800:1200;env(g,t,0.001,0.4,0.05);o.connect(g).connect(master);o.start(t);o.stop(t+0.08);}
function pad(t,midis,dur){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;f.connect(padBus);
  midis.forEach(m=>{['triangle','sine'].forEach((tp,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=tp;o.frequency.value=mf(m+(k?12:0));o.detune.value=k?3:-3;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(k?0.05:0.14,t+0.02);g.gain.exponentialRampToValueAtTime(k?0.02:0.07,t+0.4);
    g.gain.setValueAtTime(k?0.02:0.07,t+Math.max(0.45,dur-0.08));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(f);o.start(t);o.stop(t+dur+0.05);});});}
function bassNote(m){const t=ctx.currentTime,f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(300,t+0.6);
  const g=ctx.createGain();env(g,t,0.005,0.5,1.3);f.connect(g).connect(master);
  ['sawtooth','sine'].forEach((tp,k)=>{const o=ctx.createOscillator();o.type=tp;o.frequency.value=mf(m)*(k?2:1);const og=ctx.createGain();og.gain.value=k?0.5:0.6;o.connect(og).connect(f);o.start(t);o.stop(t+1.4);});}

const play={on:false,idx:-1,count:0,n:0,next:0,timer:0,q:[],raf:0,lock:null};
function chordAtBeat(b){const p=prog();let a=0;for(let i=0;i<p.chords.length;i++){const c=p.chords[i];if(b<a+c.b)return{i,off:b-a,c};a+=c.b;}return{i:0,off:0,c:p.chords[0]};}
function scheduleBeat(n,t){
  const bd=60/S.tempo;
  if(n<4){click(t,n===0);play.q.push({t,count:4-n,beat:n});return;}
  const p=prog(),T=p.chords.reduce((a,c)=>a+c.b,0),b=(n-4)%T,inBar=b%4,{i,off,c}=chordAtBeat(b);
  if(inBar===0||inBar===2)kick(t); if(inBar===1||inBar===3)snare(t);
  hat(t,0.16);hat(t+bd/2,0.08);
  if(off===0){const r=chordRoot(c);let base=48+r;if(base<52)base+=12;pad(t,Q[c.q].iv.map(x=>base+x),c.b*bd);}
  play.q.push({t,idx:i,beat:inBar,bar:Math.floor(b/4)+1,bars:T/4});
}
function tick(){while(play.next<ctx.currentTime+0.12){scheduleBeat(play.n,play.next);play.next+=60/S.tempo;play.n++;}}
function ui(){
  const now=ctx.currentTime;let changed=false;
  while(play.q.length&&play.q[0].t<=now){const e=play.q.shift();
    if(e.count){play.count=e.count;$('nowChord').textContent=e.count;$('mChord').textContent=e.count;setBeats(e.beat);$('barNo').textContent='カウント';}
    else{play.count=0;setBeats(e.beat);$('barNo').textContent=`${e.bar} / ${e.bars} 小節`;if(e.idx!==play.idx){play.idx=e.idx;changed=true;}}}
  if(changed){renderStrip();if(S.follow)renderBoard();}
  play.raf=requestAnimationFrame(ui);
}
function start(){ensureAudio();if(play.on)return;
  Object.assign(play,{on:true,idx:-1,count:4,n:0,q:[],next:ctx.currentTime+0.08});
  play.timer=setInterval(tick,25);tick();play.raf=requestAnimationFrame(ui);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>play.lock=l).catch(()=>{});}catch(e){}
  renderStrip();
}
function stop(){if(!play.on)return;play.on=false;clearInterval(play.timer);cancelAnimationFrame(play.raf);play.q=[];play.idx=-1;play.count=0;
  if(padBus){padBus.disconnect();padBus=ctx.createGain();padBus.gain.value=S.vc*0.5;padBus.connect(master);}
  try{play.lock&&play.lock.release();}catch(e){}play.lock=null;
  setBeats(-1);$('barNo').innerHTML='&nbsp;';renderStrip();renderBoard();
  const lp=$('lplay');if(lp)lp.textContent='▶ この設定で伴奏スタート';}
$('play').onclick=$('mplay').onclick=()=>{play.on?stop():start();if(S.tab==='lesson')renderPanel();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();$('play').click();}});

/* ---------- boot ---------- */
fillSelects();
if(mqPhone.matches)$('ctlBox').open=false;

all();
</script>
</body>
